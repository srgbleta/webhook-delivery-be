services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  
  migrate:
    image: ghcr.io/pressly/goose:v3.30.0
    profiles: ["tools"]
    environment:
      GOOSE_DRIVER: ${GOOSE_DRIVER:?Set GOOSE_DRIVER}
      GOOSE_DBSTRING: ${GOOSE_DBSTRING:?Set GOOSE_DBSTRING}
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - type: bind
        source: ${GOOSE_MIGRATION_DIR:?Set GOOSE_MIGRATION_DIR}
        target: /migrations
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: